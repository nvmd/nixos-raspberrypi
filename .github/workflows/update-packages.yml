name: "Update packages"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1" # 00:00 every Monday

permissions:
  contents: read

concurrency:
  group: update-packages
  cancel-in-progress: false

jobs:
  nix-update:
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: write # push the update branch
      pull-requests: write # open/update the PR

    strategy:
      # Keep updating the rest if one package fails
      fail-fast: false
      matrix:
        include:
          # Release-tagged packages: nix-update picks the newest stable tag
          - attr: pisugar-power-manager-rs # github:PiSugar/pisugar-power-manager-rs (also bumps cargoHash)
            args: ""
          - attr: rpicam-apps # github:raspberrypi/rpicam-apps
            args: ""

          # Rolling vendor sources with no releases: track the default branch HEAD
          # nix-update rewrites the version to `<unstable>-YYYY-MM-DD` + new rev/hash.
          - attr: raspberrypi-utils # github:raspberrypi/utils
            args: "--version=branch"

          # - attr: raspberrypi-udev-rules
          #   args: "--version=branch=pios/trixie"

    steps:
      # Optional GitHub App token: PRs opened with the default GITHUB_TOKEN
      # don't trigger CI, PRs opened with an app token do.
      # To enable: create a GitHub App with read and write access to "Contents"
      # and "Pull requests", install it on the repository, then set the
      # `BOT_APP_CLIENT_ID` variable and the `BOT_APP_PRIVATE_KEY` secret.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        if: vars.BOT_APP_CLIENT_ID != ''
        with:
          client-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix-action

      - name: Run nix-update for ${{ matrix.attr }}
        run: nix run nixpkgs#nix-update -- --flake ${{ matrix.args }} ${{ matrix.attr }}

      - name: Create pull request
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          branch: update-packages/${{ matrix.attr }}
          delete-branch: true
          commit-message: "${{ matrix.attr }}: update via nix-update"
          title: "${{ matrix.attr }}: automated update"
          body: |
            Automated package update opened by the `Update packages` workflow.

            - Package: `${{ matrix.attr }}`
            - Tool: `nix-update --flake ${{ matrix.args }} ${{ matrix.attr }}`

            Review the version/hash diff and let CI build before merging.

            > [!NOTE]
            > If CI didn't run on this PR, it was opened with the default
            > `GITHUB_TOKEN` (see `update-packages.yml` to set up an app token
            > instead): close and reopen the PR, or push to its branch, to run CI.

      # Optional: merge the PR once its required checks pass.
      # To enable: set the `BOT_AUTO_MERGE` variable to `true` and allow
      # auto-merge in the repository settings, but only after requiring the CI
      # checks on the target branch: without required checks there's nothing
      # for auto-merge to wait for.
      - name: Enable auto-merge
        if: >-
          vars.BOT_AUTO_MERGE == 'true' && steps.app-token.outputs.token != ''
          && (steps.create-pr.outputs.pull-request-operation == 'created'
          || steps.create-pr.outputs.pull-request-operation == 'updated')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: gh pr merge --auto --merge --repo "$GITHUB_REPOSITORY" "$PR_NUMBER"
